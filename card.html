<style>
:root{color-scheme:dark;--bg:#081013;--line:#1D2E34;--ink:#E6EFF1;--mute:#8FA4A9;--teal:#6FB8C2;--teal2:#8FD0D8;
 --fb:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace}
html[lang=en]{--fb:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{min-height:100dvh;background:radial-gradient(640px 420px at 50% 18%,rgba(111,184,194,.16),transparent 65%),radial-gradient(520px 420px at 100% 100%,rgba(47,135,146,.10),transparent 60%),var(--bg);
 color:var(--ink);font-family:var(--fb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
 padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:10px}
.wrap{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}

/* language */
.bar{display:flex;justify-content:center}
.lang{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.lang button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;color:#9FB6BB;cursor:pointer;transition:.2s}
.lang button[aria-pressed=true]{background:var(--teal);color:#081013}

/* the card */
.scene{perspective:1100px;width:100%;animation:enter .9s cubic-bezier(.2,.8,.2,1) backwards}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.card{position:relative;width:100%;aspect-ratio:1.586;cursor:pointer;display:block;user-select:none;-webkit-user-select:none;
 transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--flip,0deg)));
 transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.card.tilting{transition:transform .12s linear}
.card.flipped{--flip:180deg}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.96)}}
.face{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 box-shadow:0 30px 60px -24px rgba(0,0,0,.85),0 0 0 1px rgba(143,208,216,.16) inset;text-align:start}
.back{transform:rotateY(180deg)}
.front{background:linear-gradient(135deg,#0D1C21 0%,#15343A 45%,#23656D 100%)}
.back{background:linear-gradient(135deg,#0B171B,#12262B)}
.face::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:20px 20px;
 -webkit-mask-image:radial-gradient(120% 90% at 100% 0%,#000,transparent 70%);mask-image:radial-gradient(120% 90% at 100% 0%,#000,transparent 70%)}
/* glare follows the finger / cursor */
.glare{position:absolute;inset:0;pointer-events:none;opacity:var(--go,.55);transition:opacity .4s;
 background:radial-gradient(420px circle at var(--gx,30%) var(--gy,20%),rgba(190,240,246,.20),transparent 45%)}
/* slow sheen */
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.10) 50%,transparent 65%);background-size:260% 100%;animation:sw 7s ease-in-out infinite}
@keyframes sw{0%,55%{background-position:140% 0}100%{background-position:-40% 0}}
.edge{position:absolute;inset:0;border-radius:18px;pointer-events:none;padding:1px;background:linear-gradient(135deg,rgba(143,208,216,.55),rgba(143,208,216,0) 40%,rgba(143,208,216,0) 60%,rgba(143,208,216,.35));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.fin{position:absolute;inset:0;padding:6.5% 7%;display:flex;flex-direction:column;justify-content:space-between}
.frow{display:flex;justify-content:space-between;align-items:flex-start}
.wm{height:clamp(12px,4.2vw,16px);width:auto;display:block}
.mk{width:clamp(34px,11vw,44px);height:auto;filter:drop-shadow(0 4px 14px rgba(111,184,194,.35))}
.big{position:absolute;inset-inline-end:-6%;bottom:-16%;width:58%;opacity:.07;pointer-events:none}
.who .brand{display:flex;align-items:center;gap:8px;font-size:clamp(10.5px,3.1vw,12px);font-weight:600;color:var(--teal2);margin-bottom:6px}
.d3{display:flex;gap:4px}.d3 i{width:5px;height:5px;border-radius:50%;background:var(--teal);opacity:.35;animation:dp 1.8s ease-in-out infinite}.d3 i:nth-child(2){animation-delay:.2s}.d3 i:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,60%,100%{opacity:.35}30%{opacity:1}}
.who h1{margin:0;font-size:clamp(18px,5.6vw,23px);font-weight:700;line-height:1.2;letter-spacing:-.01em}
html[lang=en] .who h1{font-family:'Sora',var(--fb);font-weight:600}
.who p{margin:4px 0 0;font-size:clamp(11px,3.3vw,13px);color:#A9CDD2}
.flipic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--teal2)}
.flipic svg{width:14px;height:14px}

/* back */
.bin{position:absolute;inset:0;padding:6.5% 6.5%;display:flex;gap:5%;align-items:center}
.qr{flex:none;width:34%;aspect-ratio:1;background:#fff;border-radius:12px;padding:6px;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.qr svg{display:block;width:100%;height:100%}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(6px,2vw,10px)}
.info .t{font-size:clamp(10px,3vw,11.5px);color:var(--teal2);font-weight:600;letter-spacing:.02em}
.ln{display:flex;align-items:center;gap:8px;min-width:0;text-decoration:none;color:inherit;padding:3px 6px;margin:-3px -6px;border-radius:8px;transition:background .2s}
.ln:hover,.ln:active{background:rgba(111,184,194,.12)}
.ln:hover span{color:#fff}
.ln svg{width:14px;height:14px;flex:none;color:var(--teal)}
.ln span{font-family:var(--fm);font-size:clamp(9.5px,2.95vw,11.5px);direction:ltr;unicode-bidi:isolate;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#D5E3E6}
.hint{text-align:center;font-size:11.5px;color:var(--mute);margin-top:-2px;display:flex;align-items:center;justify-content:center;gap:6px}
.hint svg{width:13px;height:13px;color:var(--teal)}

/* actions */
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.act{display:grid;justify-items:center;gap:5px;padding:11px 2px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-decoration:none;font-size:11px;color:#C4D4D8;transition:border-color .2s,background .2s,transform .2s}
.act svg{width:19px;height:19px;color:var(--teal2)}
.act:hover,.act:active{border-color:rgba(111,184,194,.5);background:rgba(111,184,194,.08);transform:translateY(-2px)}
.two{display:grid;grid-template-columns:1fr auto;gap:8px}
.save{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;border-radius:14px;border:0;background:linear-gradient(135deg,#8FD0D8,#2F8792);color:#081013;font-weight:700;font-size:14.5px;text-decoration:none;box-shadow:0 12px 28px -14px rgba(111,184,194,.8)}
.save svg{width:18px;height:18px}
.share{display:grid;place-items:center;width:50px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);cursor:pointer;color:var(--teal2)}
.share svg{width:19px;height:19px}
.legal{text-align:center;font-size:10px;color:#566B70}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:#E6EFF1;color:#081013;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.card{transition:none}}
</style>
</head>

$("share").onclick=async()=>{const url="https://alpharev.vercel.app/card";
 try{if(navigator.share){await navigator.share({title:T[lang].name+" | AlphaRev",url});return;}}catch(e){return;}
 try{await navigator.clipboard.writeText(url);toast(T[lang].copied);}catch(e){toast(url);}};

/* interaction: tilt + glare + flip */
const card=$("card"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let moved=false,sx=0,sy=0;
function tilt(px,py){ // px,py in 0..1
 const flipped=card.classList.contains("flipped");
 card.style.setProperty("--rx",((.5-py)*14).toFixed(2)+"deg");
 card.style.setProperty("--ry",((px-.5)*18).toFixed(2)+"deg");
 const gx=(flipped?1-px:px)*100,gy=py*100;
 card.querySelectorAll(".glare").forEach(g=>{g.style.setProperty("--gx",gx+"%");g.style.setProperty("--gy",gy+"%");g.style.setProperty("--go",".95")});
}
function rest(){card.classList.remove("tilting");card.style.setProperty("--rx","0deg");card.style.setProperty("--ry","0deg");
 card.querySelectorAll(".glare").forEach(g=>g.style.setProperty("--go",".55"));}
if(!reduce){
 card.addEventListener("pointermove",e=>{const r=card.getBoundingClientRect();
  if(e.pointerType!=="mouse"&&Math.hypot(e.clientX-sx,e.clientY-sy)>6)moved=true;
  card.classList.add("tilting");tilt((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);});
 card.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;moved=false;});
 card.addEventListener("pointerleave",rest);card.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")setTimeout(rest,60)});
 /* gentle gyro tilt on phones that allow it without a prompt */
 let gyro=false;
 function onOri(e){if(e.beta==null)return;gyro=true;if(card.classList.contains("tilting"))return;
  const px=Math.max(0,Math.min(1,.5+(e.gamma||0)/50)),py=Math.max(0,Math.min(1,.5+((e.beta||0)-45)/50));
  card.style.setProperty("--rx",((.5-py)*10).toFixed(2)+"deg");card.style.setProperty("--ry",((px-.5)*12).toFixed(2)+"deg");
  card.querySelectorAll(".glare").forEach(g=>{g.style.setProperty("--gx",px*100+"%");g.style.setProperty("--gy",py*100+"%")});}
 if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=="function")addEventListener("deviceorientation",onOri);
}
card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();card.classList.toggle("flipped");}});
card.addEventListener("click",e=>{if(e.target.closest("a"))return;if(moved){moved=false;return;}card.classList.toggle("flipped");});
render();
</script>
</body>
</html>
